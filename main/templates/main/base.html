<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой Блог{% endblock %}</title>
    
    <!-- Bootstrap CSS (только одна версия) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Кастомные стили -->
    <style>
        :root {
            --header-bg: #212529;
            --footer-bg: #f8f9fa;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
        }
        .navbar-brand {
            font-weight: 600;
        }
        footer {
            background-color: var(--footer-bg);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Шапка -->
    <header data-bs-theme="dark">
        <div class="collapse text-bg-dark" id="navbarHeader">
          <div class="container">
            <div class="row">
              <div class="col-sm-8 col-md-7 py-4">
                <h4>О сайте</h4>
                <p>Добро пожаловать в мой блог. Здесь я публикую интересные статьи на разные темы.</p>
              </div>
              <div class="col-sm-4 offset-md-1 py-4">
                <h4>Контакты</h4>
                <ul class="list-unstyled">
                  <li><a href="#" class="text-white"><i class="bi bi-telegram"></i> Telegram</a></li>
                  <li><a href="#" class="text-white"><i class="bi bi-envelope"></i> Email</a></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
        <nav class="navbar navbar-dark bg-dark shadow-sm">
          <div class="container">
            <a href="{% url 'index' %}" class="navbar-brand d-flex align-items-center">
              <i class="bi bi-journal-text me-2"></i>
              <strong>Мой Блог</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarHeader" aria-controls="navbarHeader" 
                    aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
          </div>
        </nav>
    </header>

    <!-- Основное содержимое -->
    <main class="flex-shrink-0">
        <div class="container mt-4 mb-5">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Подвал -->
    <footer class="mt-auto py-3 bg-light">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="text-muted">&copy; {% now "Y" %} Мой Блог</span>
                </div>
                <div>
                    <a href="#" class="text-decoration-none me-3">
                        <i class="bi bi-arrow-up-circle"></i> Наверх
                    </a>
                    <a href="/about/" class="text-decoration-none">О проекте</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
